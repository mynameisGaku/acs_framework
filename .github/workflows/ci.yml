name: CI

# なぜ 2 段なのか
#
# ビルドには ACS の配布物が要るが、それは GitHub Releases に置く前提で、まだ publish
# されていない。**配布物が要らない検査まで一緒に止めるのは損**なので分けてある。
#
# checks は常に走る。build は acs-version.json に sha256 が入った時点で自動的に走り出す。
# 「CI を後で有効にする」作業を残さないための作りで、pin を入れれば勝手に本番になる。

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: repository checks
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4

      # コンパイラも配布物も要らない検査。落ちるものはどれも
      # 「レビューでは見えず、後で高くつく」たぐいのもの。
      - name: run repo checks
        shell: pwsh
        run: .\Tools\RunRepoChecks.ps1

  build:
    name: build and test
    runs-on: windows-2025-vs2026
    needs: checks
    steps:
      - uses: actions/checkout@v4

      # sha256 が空 = 配布物がまだ publish されていない。**赤くせずに飛ばす。**
      # 直せない理由で永久に赤い CI は、本当の失敗を見えなくする。
      - name: is the engine distribution pinned?
        id: pin
        shell: pwsh
        run: |
          $pin = Get-Content Tools\acs-version.json -Raw | ConvertFrom-Json
          $ready = -not [string]::IsNullOrWhiteSpace($pin.sha256)
          "ready=$($ready.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $ready) {
            Write-Host "::notice::ACS の Release がまだ pin されていないので build を飛ばします。" `
              "Tools/acs-version.json の sha256 を埋めると、この job が自動で走り始めます。"
          }

      # ACS取得、v145のDebug/Releaseビルド、両構成のテストをローカルと同じ入口で行う。
      # 窓とGPUを使う見た目の確認だけは実機のTools\CaptureApp.ps1へ残す。
      - name: run full CI checks
        if: steps.pin.outputs.ready == 'true'
        shell: pwsh
        run: .\Tools\RunCiChecks.ps1
